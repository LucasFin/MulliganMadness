[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
# Must match your Thunderstore team name exactly
namespace = "LJIndustries"
name = "MulliganMadness"
versionNumber = "0.3.7"
description = "Take All, card manipulation, stats HUD/tab/compare/preview (Infoholic + TabInfo replacement)."
websiteUrl = "https://github.com/LucasFin/MulliganMadness"
containsNsfwContent = false

[package.dependencies]
"BepInEx-BepInExPack_ROUNDS" = "5.4.1900"
"willis81808-UnboundLib" = "3.2.14"
"Pykess-ModdingUtils" = "0.4.8"
"Pykess-CardChoiceSpawnUniqueCardPatch" = "0.1.10"
"willuwontu-WillsWackyManagers" = "1.5.13"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./package/MulliganMadness.dll"
target = "MulliganMadness.dll"

[[build.copy]]
source = "./package/TabInfo.dll"
target = "TabInfo.dll"

[[build.copy]]
source = "./package/Art"
target = "Art"

[publish]
repository = "https://thunderstore.io"
communities = ["rounds"]

[publish.categories]
rounds = ["gameplay", "custom-cards"]
